<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">MediQueue lifecycles</title><desc id="d">A token moves from waiting to called to in consultation to completed, or ends as no show or cancelled. A bed moves from available to occupied to cleaning and back.</desc><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;white-space:pre;}
.m{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;}
.flow{stroke-dasharray:3 7;animation:flow 1.1s linear infinite;}
.flow-slow{stroke-dasharray:2 8;animation:flow 2.4s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-20;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
