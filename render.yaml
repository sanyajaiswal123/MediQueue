services:
  - type: web
    name: mediqueue
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn mediqueue.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEMO_LOCKED_USERS
        value: patient
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
