{% comment %}Floating pill sidebar (vertically centred). Items come from mediqueue.context_processors.nav (role-aware).{% endcomment %}
<nav class="sidebar" data-sidebar aria-label="Staff navigation">
  <div class="sidebar__panel">
    <button type="button" class="sidebar__item sidebar__toggle" data-sidebar-toggle aria-expanded="false" aria-controls="sidebar-links">
      {% include "partials/icon.html" with name="menu" %}
      <span class="sidebar__label" style="--i:0">Menu</span>
    </button>
    <div class="sidebar__sep" aria-hidden="true"></div>

    <div id="sidebar-links" class="flex flex-col gap-1">
      {% for item in staff_nav %}
      <a class="sidebar__item" href="{{ item.url }}" {% if item.active %}aria-current="page"{% endif %}>
        {% include "partials/icon.html" with name=item.icon %}<span class="sidebar__label" style="--i:{{ forloop.counter }}">{{ item.label }}</span>
      </a>
      {% endfor %}
    </div>

    <div class="sidebar__sep" aria-hidden="true"></div>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="sidebar__item">
        {% include "partials/icon.html" with name="logout" %}<span class="sidebar__label" style="--i:{{ staff_nav|length|add:1 }}">Sign out</span>
      </button>
    </form>
  </div>
</nav>
