{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MediQueue{% endblock %}</title>
  <meta name="description" content="{% block description %}MediQueue: OPD tokens, beds and pharmacy for city hospitals, with a live public dashboard.{% endblock %}">
  <meta name="theme-color" content="#f3f1ee">
  <script>
    /* Theme before first paint: saved choice, else the OS setting (no flash). */
    (function () {
      var t = null;
      try { t = localStorage.getItem('mq-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121110');
    })();
  </script>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <script type="module" src="{% static 'dist/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
